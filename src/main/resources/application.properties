spring.application.name=cv

# Set the server port to the value of the PORT environment variable, or default to 8080 if not set.
server.port=${PORT:8080}

# API DeepL Traduzione
deepl.api.key=${DEEPL_API_KEY:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/curriculum_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Defensive limits for multipart requests when forms contain many fields/files.
server.tomcat.max-part-count=500
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB